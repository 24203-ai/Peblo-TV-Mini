version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: peblo_mini
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    command: bash -c "alembic upgrade head && python scripts/seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/peblo_mini
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./assets:/app/assets

  cms:
    build:
      context: ./frontend/cms
      args:
        VITE_API_URL: http://localhost:8000/admin
    ports:
      - "3000:80"
    depends_on:
      - backend

  viewer:
    build:
      context: ./frontend/viewer
    ports:
      - "4000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
